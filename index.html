
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="color-scheme" content="light" />

    <!-- Primary SEO -->
    <title>DataLens Analytics | Interactive Data Visualization & Analysis</title>
    <meta
      name="description"
      content="Explore CSV and Excel datasets with DataLens Analytics. Visualize data using interactive charts, analyze statistics, filter records, and experiment with linear regression predictions."
    />
    <meta
      name="keywords"
      content="DataLens, data analytics dashboard, data visualization, CSV analyzer, Excel data analysis, interactive charts, React analytics dashboard, linear regression"
    />
    <meta name="author" content="DataLens" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL: Replace with your actual deployed URL -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph: Facebook, LinkedIn, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DataLens Analytics" />
    <meta
      property="og:title"
      content="DataLens Analytics | Explore Your Data"
    />
    <meta
      property="og:description"
      content="Upload CSV and Excel files, visualize data, calculate statistics, and explore predictive analytics with DataLens."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:image"
      content="https://your-domain.com/social-preview.png"
    />
    <meta property="og:image:alt" content="DataLens Analytics dashboard preview" />

    <!-- Twitter / X Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DataLens Analytics | Interactive Data Dashboard"
    />
    <meta
      name="twitter:description"
      content="Analyze CSV and Excel datasets with interactive charts, statistics, and predictive analytics."
    />
    <meta
      name="twitter:image"
      content="https://your-domain.com/social-preview.png"
    />

    <!-- Performance -->
    <meta name="format-detection" content="telephone=no" />

    <title>DataLens Analytics</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
